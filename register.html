<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="votehubstyle.css">
</head>

<body class="register-page">

    <form id="register-form">

        <div class="weird">
            <div class="host-you">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <div class="noyou">
                <h3>Campus <span>Vote</span></h3>
                <p>Smart Elections, Strong Campus</p>
            </div>
        </div>

        <div class="eager-vote">
            <h2>Create Your Account</h2>
            <p>Join Campus Vote and make your voice count</p>
        </div>

        <div class="register-pace">
            <label for="register">Name</label>
            <div class="name-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="register" name="register" placeholder="Enter your name">
            </div>
        </div>

        <div class="register-pace">
            <label for="email">Email</label>
            <div class="email-border">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="Enter your Email-id">
            </div>
        </div>

        <div class="register-pace">
            <label for="number">Phone Number</label>
            <div class="phone-box">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" id="number" name="number" placeholder="Enter your Number">
            </div>
        </div>

        <div class="register-pace">
            <label for="password">Password</label>
            <div class="password-bordert">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Enter your Password">
            </div>
        </div>

        <div class="register-pace">
            <label for="confirm-password">Confirm Password</label>
            <div class="password-nou">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="confirm-password" name="confirm-password"
                    placeholder="Enter your confirm-password">
            </div>
        </div>

        <div class="register-button">
            <button type="submit">Register</button>
        </div>

        <div class="or">
            <span>OR</span>
        </div>

        <div class="compete">
            <a href="/login" class="an-account">
                <i class="fa-solid fa-arrow-left"></i>
                Already have an account? Login
            </a>
        </div>

    </form>

</body>

</html>
